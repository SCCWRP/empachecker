<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMPA Checker - Admin Portal</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .admin-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .admin-header h1 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .admin-header p {
            color: #666;
        }
        
        .tool-button {
            width: 100%;
            padding: 20px;
            margin-bottom: 15px;
            font-size: 18px;
            font-weight: 500;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .tool-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .tool-button i {
            font-size: 24px;
        }
        
        .btn-inventory {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        
        .btn-schema {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        
        .btn-polygon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
        }
        
        .login-form {
            margin-top: 30px;
        }
        
        .password-input {
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }
        
        .password-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .login-button {
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            width: 100%;
        }
        
        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
        
        .tool-icon {
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>EMPA Admin Portal</h1>
            <p>Access administrative tools and utilities</p>
        </div>
        
        <!-- Admin Tools -->
        <div class="tools-section">
            <a href="https://nexus.sccwrp.org/empachecker/inventory" target="_blank" class="btn tool-button btn-inventory">
                <span>
                    <strong>Inventory</strong><br>
                    <small>View and manage data inventory</small>
                </span>
                <div class="tool-icon">→</div>
            </a>
            
            <a href="https://nexus.sccwrp.org/empachecker/schema" target="_blank" class="btn tool-button btn-schema">
                <span>
                    <strong>Schema</strong><br>
                    <small>Database schema documentation</small>
                </span>
                <div class="tool-icon">→</div>
            </a>
            
            <a href="https://nexus.sccwrp.org/empachecker/view-all-polygons" target="_blank" class="btn tool-button btn-polygon">
                <span>
                    <strong>Polygon Viewer</strong><br>
                    <small>View estuary and station polygons</small>
                </span>
                <div class="tool-icon">→</div>
            </a>
        </div>
        
        <div class="text-center mt-4">
            <p class="text-muted"><small>Each tool requires authentication</small></p>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
