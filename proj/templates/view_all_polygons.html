<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>EMPA All Stations Viewer</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
        integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI="
        crossorigin=""
    />

    <!-- Bootstrap CSS for dropdown styling -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    />

    <style>
        html, body {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            min-width: 250px;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .legend {
            position: absolute;
            bottom: 30px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 14px;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .legend-item {
            margin: 3px 0;
        }

        .legend-color {
            display: inline-block;
            width: 20px;
            height: 15px;
            margin-right: 5px;
            border: 1px solid #333;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .hidden {
            display: none;
        }
    </style>

    <script>
        let script_root = {{ request.script_root|tojson|safe }};
        script_root = script_root.replace('/', '');
    </script>
</head>

<body>
    <!-- Controls Panel -->
    <div id="controls">
        <h5>EMPA Stations</h5>
        <div class="mb-3">
            <label for="estuarySelect" class="form-label">Select Estuary:</label>
            <select id="estuarySelect" class="form-select">
                <option value="">-- All Estuaries --</option>
            </select>
        </div>
        <button id="resetBtn" class="btn btn-secondary btn-sm w-100">Reset View</button>
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-title">Legend</div>
        <div class="legend-item">
            <span class="legend-color" style="background: #ff0000; opacity: 0.3; border-color: #ff0000;"></span>
            <span>Estuary Boundaries</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #0000ff; opacity: 0.3; border-color: #0000ff;"></span>
            <span>Individual Stations</span>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 mb-0">Loading station data...</p>
    </div>

    <!-- Map container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
        integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM="
        crossorigin=""
    ></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom script -->
    <script src="{{ url_for('static', filename='view_all_polygons.js') }}"></script>
</body>
</html>
