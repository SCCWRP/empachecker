<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>EMPA All Stations Viewer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
        integrity="sha256-kLaT2GOSpHechhsozzB+flnD+zUyjE2LlfWPgU04xyI=" crossorigin="" />

    <!-- Bootstrap CSS for dropdown styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
        }

        .toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 8px;
            border-radius: 3px;
        }

        .toggle-btn:hover {
            background: #f0f0f0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .panel-header h5 {
            margin: 0;
            cursor: pointer;
            user-select: none;
        }

        .panel-header h5:hover {
            color: #0066cc;
        }

        #estuaryHeader,
        #viewMapNewTabBtn {
            display: inline-flex;
            align-items: center;
            background-color: #0d6efd;
            color: #fff;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.2;
            font-family: inherit;
            cursor: pointer;
        }

        #estuaryHeader:hover,
        #viewMapNewTabBtn:hover {
            background-color: #0b5ed7;
            color: #fff;
        }

        #controls.minimized .panel-content,
        #sopControls.minimized .panel-content {
            display: none;
        }

        #controls.minimized .panel-header,
        #sopControls.minimized .panel-header {
            margin-bottom: 0;
        }

        #controls {
            position: absolute;
            top: 65px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            min-width: 200px;
            max-width: 240px;
            font-size: 13px;
        }

        #controls .form-select {
            font-size: 12px;
            padding: 4px 8px;
            height: auto;
        }

        #controls .form-label {
            font-size: 12px;
            margin-bottom: 2px;
        }

        #controls .btn {
            font-size: 12px;
            padding: 4px 8px;
        }

        #controls .mb-3 {
            margin-bottom: 8px !important;
        }

        #controls small {
            font-size: 11px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        #badPointsTable {
            max-height: 300px;
            overflow-y: auto;
        }

        .table-responsive {
            max-height: 300px;
        }

        .legend {
            position: absolute;
            top: 65px;
            left: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            font-size: 14px;
        }

        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .legend-item {
            margin: 3px 0;
        }

        .legend-color {
            display: inline-block;
            width: 20px;
            height: 15px;
            margin-right: 5px;
            border: 1px solid #333;
        }

        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .hidden {
            display: none;
        }
    </style>

    <script>
        let script_root = {{ request.script_root| tojson | safe }};
        script_root = script_root.replace('/', '');
    </script>
</head>

<body>
    <!-- Banner -->
    <div
        style="position: absolute; top: 0; left: 0; right: 0; z-index: 1000; background: white; padding: 15px 30px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); text-align: center;">
        <h4 style="margin: 0; font-weight: bold;">Monitoring Estuaries</h4>
    </div>

    <!-- Controls Panel for Estuary Tab -->
    <div id="controls" class="tab-content estuary-tab active minimized">
        <div class="panel-header">
            <div style="display: flex; align-items: center; gap: 8px;">
                <button id="viewMapNewTabBtn" title="Open this map in a new tab">View map on a new tab</button>
                <h5 id="estuaryHeader" style="margin: 0;">Click to view an estuary <a href="#" id="sopLink"
                        style="font-size: 12px; margin-left: 10px; display: none; color: #fff; text-decoration: underline;">(SOP)</a></h5>
            </div>
        </div>
        <div class="panel-content">
            <div class="mb-3">
                <label for="estuaryRegionSelect" class="form-label">Select Region:</label>
                <select id="estuaryRegionSelect" class="form-select">
                    <option value="">-- Select Region --</option>
                    <option value="North">North</option>
                    <option value="South">South</option>
                    <option value="Central">Central</option>
                    <option value="Baja">Baja</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="estuarySelect" class="form-label">Select Estuary:</label>
                <select id="estuarySelect" class="form-select" disabled>
                    <option value="">-- Select Region first --</option>
                </select>
            </div>
            <button id="downloadShapefileBtn" class="btn btn-success btn-sm w-100" disabled>
                Download Shapefile (ZIP)
            </button>
            <small class="text-muted d-block mt-1">If you would like to make changes, please download a shapefile and
                send it Jan Walker (janw@sccwrp.org)</small>
            <hr>
            <button id="resetBtn" class="btn btn-secondary btn-sm w-100">Reset View</button>
        </div>
    </div>

    <!-- Controls Panel for SOP Tab -->
    <div id="sopControls" class="tab-content sop-tab minimized"
        style="position: absolute; top: 65px; right: 10px; z-index: 1000; background: white; padding: 15px; border-radius: 5px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); min-width: 350px; max-width: 400px;">
        <div class="panel-header">
            <h5><a href="#" id="backToEstuary" style="font-size: 12px; margin-right: 5px;">&larr;</a> SOP Verification
            </h5>
            <button class="toggle-btn" id="toggleSopControls" title="Expand">&#9660;</button>
        </div>
        <div class="panel-content">
            <div class="mb-3">
                <label for="regionSelect" class="form-label">Region:</label>
                <select id="regionSelect" class="form-select">
                    <option value="">-- Select Region --</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="sopSelect" class="form-label">Select SOP:</label>
                <select id="sopSelect" class="form-select" disabled>
                    <option value="">-- Select SOP --</option>
                    <option value="tbl_grabevent">Field Grab</option>
                    <option value="tbl_wq_logger_metadata">SOP 1: Continuous environmental monitoring - Metadata
                    </option>
                    <option value="tbl_waterquality_metadata">SOP 2: Discrete environmental monitoring - point water
                        quality measurements</option>
                    <option value="tbl_edna_metadata">SOP 4: eDNA - field</option>
                    <option value="tbl_benthiclarge_metadata">SOP 6: Benthic infauna, large</option>
                    <option value="tbl_macroalgae_sample_metadata">SOP 7: Macroalgae</option>
                    <option value="tbl_bruv_metadata">SOP 8: Fish - BRUVs - field</option>
                    <option value="tbl_fish_sample_metadata">SOP 9: Fish seines</option>
                    <option value="tbl_crabtrap_metadata">SOP 10: Crab traps</option>
                    <option value="tbl_vegetation_sample_metadata">SOP 11: Marsh plain vegetation and epifauna surveys
                    </option>
                    <option value="tbl_feldspar_metadata">SOP 13: Sediment accretion rates</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="badSiteSelect" class="form-label">Problematic Sites:</label>
                <select id="badSiteSelect" class="form-select" disabled>
                    <option value="">-- Select Region and SOP first --</option>
                </select>
            </div>
            <button id="resetSopBtn" class="btn btn-secondary btn-sm w-100">Reset View</button>

            <div id="badPointsTable" class="mt-3" style="display: none;">
                <h6>Selected Point Details:</h6>
                <div class="table-responsive">
                    <table class="table table-sm table-bordered">
                        <tbody id="badPointTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Legend -->
    <div class="legend">
        <div class="legend-title">Legend</div>
        <div class="legend-item">
            <span class="legend-color" style="background: #ff0000; opacity: 0.3; border-color: #ff0000;"></span>
            <span>Estuary Polygon</span>
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #0000ff; opacity: 0.3; border-color: #0000ff;"></span>
            <span>Station Polygon</span>
        </div>
    </div>

    <!-- Loader -->
    <div id="loader">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 mb-0">Loading station data...</p>
    </div>

    <!-- Map container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"
        integrity="sha256-WBkoXOwTeyKclOHuWtc+i2uENFpDZ9YPdf5Hf+D7ewM=" crossorigin=""></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom script -->
    <script src="{{ url_for('static', filename='view_all_polygons.js') }}"></script>
</body>

</html>
